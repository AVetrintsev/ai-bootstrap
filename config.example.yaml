ssh:
  allow_from_any_ipv4: true
  # Для ограничения источников удалите allow_from_any_ipv4 и задайте admin_ipv4: [192.0.2.24/32].

portal:
  transport: local-http
  # Для https задайте domain и expected_ipv4.

sandbox:
  memory_percent: 80  # Общий пул для всех песочниц, процент всей RAM VM.
  cpu_percent: 80     # Общий пул для всех песочниц, процент мощности всех vCPU VM.
  internal_tcp: []
  # Здесь можно перечислить доверенные службы во внутренних сетях, например "10.2.3.4:8443".

# Включите после сохранения ключа на хосте командой sudo ai-model-key modelstudio.
# model_gateway:
#   providers:
#     modelstudio:
#       base_url: https://YOUR-WORKSPACE.ap-southeast-1.maas.aliyuncs.com/compatible-mode/v1
#       key_file: /etc/ai-bootstrap/model-keys/modelstudio.key
#   models:
#     qwen3-coder-flash: {provider: modelstudio, model: qwen3-coder-flash}
#   defaults:
#     models: [qwen3-coder-flash]
#     requests_per_day: 100
#     max_output_tokens: 8192
#   projects: {}
#   # Здесь можно переопределить всю политику для конкретной песочницы.
#   # projects:
#   #   example: {models: [qwen3-coder-flash], requests_per_day: 20, max_output_tokens: 4096}

mihomo:
  profile: |
    mode: rule
    allow-lan: false
    ipv6: false
    tun:
      enable: true
      device: ai-mihomo
      auto-route: false
      auto-redirect: false
      dns-hijack: ["any:53", "tcp://any:53"]
    dns:
      enable: true
      listen: "127.0.0.1:1053"
      ipv6: false
      nameserver: ["https://1.1.1.1/dns-query#egress"]
    proxies:
      - name: egress
        type: socks5
        server: 203.0.113.10
        port: 1080
        udp: true
    rules:
      - DOMAIN,example.org,DIRECT
      - MATCH,egress
      - MATCH,REJECT
