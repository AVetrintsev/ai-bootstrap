user www-data;
pid /run/nginx.pid;
error_log /dev/null crit;

events {}

http {
    server_tokens off;
    access_log off;

    upstream ai_portal {
        server unix:/run/ai-bootstrap-portal.sock;
    }

    limit_req_zone $binary_remote_addr zone=owner_registration:1m rate=1r/s;

    server {
        listen 127.0.0.1:8080 default_server;
        return 404;
    }

    server {
        listen 127.0.0.1:8080;
        server_name localhost 127.0.0.1;

        location = /_session {
            internal;
            proxy_method GET;
            proxy_pass_request_body off;
            proxy_pass_request_headers off;
            proxy_set_header Content-Length "";
            proxy_set_header Cookie $http_cookie;
            proxy_pass http://ai_portal/_session;
        }

        location = /_not_found {
            internal;
            return 404;
        }

        location ^~ /_owner/ {
            limit_req zone=owner_registration burst=10 nodelay;
            limit_req_status 429;
            client_max_body_size 1k;
            proxy_pass_request_headers off;
            proxy_set_header Content-Type $content_type;
            proxy_set_header X-Portal-Client-IP $remote_addr;
            proxy_set_header X-Portal-Scheme $scheme;
            proxy_pass http://ai_portal/_owner/;
        }

        location / {
            auth_request /_session;
            error_page 403 =404 /_not_found;
            proxy_pass_request_headers off;
            client_max_body_size 2k;
            proxy_set_header Cookie $http_cookie;
            proxy_set_header Content-Type $content_type;
            proxy_set_header X-Portal-Scheme $scheme;
            proxy_set_header Sec-Fetch-Mode $http_sec_fetch_mode;
            proxy_set_header Sec-Fetch-Dest $http_sec_fetch_dest;
            proxy_set_header Sec-Purpose $http_sec_purpose;
            proxy_set_header Purpose $http_purpose;
            proxy_buffering off;
            proxy_pass http://ai_portal;
        }
    }
}
