[Unit]
Requires=ai-bootstrap-portal.socket
After=ai-bootstrap-portal.socket

[Service]
ExecStartPre=
ExecStartPre=/usr/sbin/nginx -t -q -c /etc/ai-bootstrap/nginx.conf
ExecStart=
ExecStart=/usr/sbin/nginx -c /etc/ai-bootstrap/nginx.conf
ExecReload=
ExecReload=/usr/sbin/nginx -c /etc/ai-bootstrap/nginx.conf -s reload
