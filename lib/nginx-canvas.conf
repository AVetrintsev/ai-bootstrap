# All frontend files and every project HTTP/WS route share the portal gate.
location ~ ^/(canvas|agent|conversations|launch|customize|skills|plugins|apps|extensions|mcp|settings|automations|shared|assets|locales|oauth|favicon\.svg)(/|$) {
    auth_request /_session;
    error_page 403 =404 /_not_found;
    client_max_body_size 16m;
    proxy_http_version 1.1;
    proxy_pass_request_headers off;
    proxy_set_header Host $http_host;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Content-Type $content_type;
    proxy_set_header Accept $http_accept;
    proxy_set_header Origin $http_origin;
    proxy_set_header Range $http_range;
    proxy_set_header X-Session-API-Key $http_x_session_api_key;
    proxy_set_header X-Expose-Secrets $http_x_expose_secrets;
    proxy_set_header Sec-Fetch-Mode $http_sec_fetch_mode;
    proxy_set_header Sec-Fetch-Dest $http_sec_fetch_dest;
    proxy_set_header Sec-Purpose $http_sec_purpose;
    proxy_set_header Purpose $http_purpose;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $canvas_connection;
    proxy_set_header Sec-WebSocket-Key $http_sec_websocket_key;
    proxy_set_header Sec-WebSocket-Version $http_sec_websocket_version;
    proxy_set_header Sec-WebSocket-Protocol $http_sec_websocket_protocol;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_pass http://ai_canvas;
}
