user www-data;
pid /run/nginx.pid;
error_log /dev/null crit;

events {}

http {
    server_tokens off;
    access_log off;

    upstream ai_portal {
        server unix:/run/ai-bootstrap-portal.sock;
    }
    upstream ai_canvas {
        server unix:/run/ai-bootstrap-canvas.sock;
    }
    map $http_upgrade $canvas_connection {
        default upgrade;
        '' close;
    }

    limit_req_zone $binary_remote_addr zone=owner_registration:1m rate=1r/s;
    ssl_protocols TLSv1.2 TLSv1.3;
